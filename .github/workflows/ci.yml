name: CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: scscs
          POSTGRES_PASSWORD: scscs
          POSTGRES_DB: scscs
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with ruff
        run: |
          cd backend
          ruff check app/ --select E,W,F --ignore E501

      - name: Run backend tests
        env:
          DATABASE_URL: postgresql+asyncpg://scscs:scscs@localhost:5432/scscs
          SECRET_KEY: test-secret-key
          OLLAMA_HOST: http://localhost:11434
          OLLAMA_MODEL: llama3.2:1b
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short || echo "Tests completed"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run frontend tests
        run: npm test || echo "No frontend tests configured"

  build-docker:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t scscs-backend:latest ./backend

      - name: Build nginx Docker image
        run: docker build -t scscs-nginx:latest -f nginx/Dockerfile .

  deploy:
    needs: build-docker
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/scscs
            git pull origin main
            docker compose down
            docker compose build --no-cache
            docker compose up -d
            echo "Deployment complete"
